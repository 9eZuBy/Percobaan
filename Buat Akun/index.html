<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - UMTacademy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="icon" type="image/png" href="UMT-Logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-purple: #6A0DAD;
            --secondary-purple: #7D2ED1;
            --dark-bg: #141414;
            --card-bg: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #ccc;
            --border-color: #333;
            --error-color: #f44336;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #141414;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
            overflow-x: hidden;
        }

        #registration-form-container {
            background: #1c1c1c;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(106, 13, 173, 0.1);
            position: relative;
            z-index: 1;
            animation: slideInUp 0.8s ease-out;
            text-align: center;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .registration-header { margin-bottom: 40px; }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-image {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin-right: 15px;
            box-shadow: 0 4px 15px rgba(106, 13, 173, 0.3);
            object-fit: cover;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .registration-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
            text-align: left;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        select:disabled {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ccc' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: var(--primary-purple);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(106, 13, 173, 0.1);
            transform: translateY(-2px);
        }
        
        select option {
            background: var(--dark-bg);
            color: var(--text-primary);
        }

        select:required:invalid { color: var(--text-secondary); }
        option[value=""][disabled] { display: none; }
        
        .lifetime-option {
            background: linear-gradient(135deg, #FFD700, #DAA520);
            color: #2b1d00;
            font-weight: 700;
        }
        
        input[type="file"] { display: none; }
        
        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            border-color: var(--primary-purple);
            color: var(--text-primary);
            background: rgba(106, 13, 173, 0.1);
        }

        .file-upload-label.has-file {
            border-color: #10B981;
            background: rgba(16, 185, 129, 0.08);
            color: #10B981;
        }

        .file-upload-label i { margin-right: 10px; }

        #file-name-display {
            font-size: 12px;
            color: #10B981;
            margin-top: 8px;
            text-align: left;
            word-break: break-all;
            display: none;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-purple) 0%, var(--secondary-purple) 100%);
            border: none;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button[type="submit"]:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(106, 13, 173, 0.4);
        }

        button[type="submit"]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: var(--error-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 1rem;
            display: none;
            animation: slideDown 0.3s ease-out;
            text-align: left;
            line-height: 1.5;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-link {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-link a {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .success-message {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10B981;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            text-align: left;
            animation: slideIn 0.5s ease;
            font-size: 14px;
            line-height: 1.6;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .payment-info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }

        .payment-info-box p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .payment-info-box strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .payment-methods {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .payment-methods li {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .payment-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .payment-details {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: monospace;
            font-size: 15px;
            color: #fff;
        }

        .copy-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .copy-btn:hover { background: var(--secondary-purple); }
        .copy-btn.copied { background-color: #10B981; }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 28px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease, transform 0.3s ease;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-primary);
            transform: scale(1.2);
        }

        /* Validasi password visual */
        .password-hint {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
            display: block;
        }

        .input-error {
            border-color: var(--error-color) !important;
            box-shadow: 0 0 0 4px rgba(244, 67, 54, 0.1) !important;
        }

        @media (max-width: 540px) {
            #registration-form-container { padding: 40px 25px; }
        }
    </style>
</head>
<body>
    <div id="registration-form-container">
        <a href="../" class="close-btn" title="Keluar">&times;</a>
        <form id="registration-form" novalidate>
            <div class="registration-header">
                <div class="logo-container">
                    <img src="UMT-Logo.png" alt="Logo" class="logo-image">
                    <span class="logo-text">UMTacademy</span>
                </div>
                <h2>Buat Akun Baru</h2>
                <p class="registration-subtitle">Lengkapi data diri Anda untuk mendaftar.</p>
            </div>

            <div class="form-content">
                <div class="form-group">
                    <label for="fullName" class="form-label">Nama Lengkap</label>
                    <input type="text" id="fullName" placeholder="Masukkan nama lengkap Anda" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp" class="form-label">Nomor WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="Contoh: 081234567890" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email Anda" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" placeholder="Buat password (min. 8 karakter)" required minlength="8">
                    <span class="password-hint">Minimal 8 karakter</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" placeholder="Ulangi password Anda" required>
                </div>

                <div class="form-group">
                    <label for="membershipPackage" class="form-label">Pilih Paket Keanggotaan</label>
                    <select id="membershipPackage" required>
                        <option value="" disabled selected>Pilih paket langganan...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" style="font-size: 16px; font-weight: 600; color: var(--text-primary);">
                        <i class="fas fa-wallet"></i> Lakukan Pembayaran
                    </label>
                    <div class="payment-info-box">
                        <p id="payment-instruction">Silakan pilih paket keanggotaan di atas untuk melihat total pembayaran.</p>
                        <ul class="payment-methods">
                            <li>
                                <div class="payment-brand">
                                    <span>Gopay / Dana / OVO / ShopeePay</span>
                                </div>
                                <div class="payment-details">
                                    <span>085961160545</span>
                                    <button type="button" class="copy-btn" data-copy="085961160545">Salin</button>
                                </div>
                            </li>
                            <li>
                                <div class="payment-brand">
                                    <span>Seabank</span>
                                </div>
                                <div class="payment-details">
                                    <span>901165420223</span>
                                    <button type="button" class="copy-btn" data-copy="901165420223">Salin</button>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="paymentProof" class="form-label" style="font-size: 16px; font-weight: 600; color: var(--text-primary);">
                        <i class="fas fa-receipt"></i> Upload Bukti Pembayaran
                    </label>
                    <label for="paymentProof" class="file-upload-label" id="fileUploadLabel">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="fileUploadText">Pilih File (Gambar/PDF, maks. 10MB)</span>
                    </label>
                    <input type="file" id="paymentProof" accept="image/*,.pdf" required>
                    <div id="file-name-display"></div>
                </div>

                <div class="success-message" id="successMessage"></div>
                <div id="error-message"></div>

                <button type="submit">
                    <i class="fas fa-paper-plane"></i>&nbsp; Daftar Sekarang
                </button>

                <div class="login-link">
                    Sudah punya akun? <a href="../Login/">Login di sini</a>
                </div>
            </div>
        </form>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const BOT_TOKEN = "8239110275:AAFN1waR1xOuZMcs8HB7dbzC0-uG6qMQ0qA";
    const CHAT_ID   = "6919363709";
    const MAX_FILE_SIZE_MB = 10;

    const membershipPackages = [
        { value: "1 Bulan",   text: "1 Bulan (Coba Dulu)",        price: 25000 },
        { value: "3 Bulan",   text: "3 Bulan (Rekomendasi)",       price: 49000 },
        { value: "6 Bulan",   text: "6 Bulan (Best Value)",        price: 75000 },
        { value: "1 Tahun",   text: "1 Tahun (Paling Hemat)",      price: 99000 },
        { value: "Lifetime",  text: "Lifetime (Penawaran Terbaik)",price: 30000, special: true }
    ];

    // ── DOM refs ──────────────────────────────────────────────
    const registrationForm      = document.getElementById('registration-form');
    const packageSelect         = document.getElementById('membershipPackage');
    const paymentInstruction    = document.getElementById('payment-instruction');
    const fileInput             = document.getElementById('paymentProof');
    const fileUploadLabel       = document.getElementById('fileUploadLabel');
    const fileUploadText        = document.getElementById('fileUploadText');
    const fileNameDisplay       = document.getElementById('file-name-display');
    const errorMessageContainer = document.getElementById('error-message');
    const successMessageContainer = document.getElementById('successMessage');
    const submitButton          = registrationForm.querySelector('button[type="submit"]');

    // ── Isi dropdown paket ────────────────────────────────────
    function populatePackageOptions() {
        membershipPackages.forEach(pkg => {
            const option = document.createElement('option');
            option.value = pkg.value;
            option.textContent = `${pkg.text} — Rp ${pkg.price.toLocaleString('id-ID')}`;
            option.dataset.price = pkg.price;
            if (pkg.special) option.classList.add('lifetime-option');
            packageSelect.appendChild(option);
        });
    }

    // ── Update info harga berdasarkan paket dipilih ───────────
    function updatePaymentInfo() {
        const selected = packageSelect.options[packageSelect.selectedIndex];
        if (selected && selected.dataset.price) {
            const price = parseInt(selected.dataset.price, 10);
            paymentInstruction.innerHTML =
                `Silakan lakukan pembayaran sebesar <strong>Rp ${price.toLocaleString('id-ID')}</strong> ke salah satu rekening di bawah ini.`;
        } else {
            paymentInstruction.innerHTML =
                `Silakan pilih paket keanggotaan di atas untuk melihat total pembayaran.`;
        }
    }

    // ── Tampilkan / sembunyikan error ─────────────────────────
    function showError(message) {
        errorMessageContainer.innerHTML = `<i class="fas fa-exclamation-circle"></i>&nbsp; ${message}`;
        errorMessageContainer.style.display = 'block';
        errorMessageContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideError() {
        errorMessageContainer.style.display = 'none';
        errorMessageContainer.innerHTML = '';
    }

    // ── Highlight field yang error ────────────────────────────
    function markError(el) {
        el.classList.add('input-error');
        el.addEventListener('input', () => el.classList.remove('input-error'), { once: true });
    }

    // ── Validasi semua field sebelum kirim ────────────────────
    function validateForm(data, paymentFile) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const waRegex    = /^(\+62|62|0)8[1-9][0-9]{6,11}$/;

        if (!data.fullName) {
            markError(document.getElementById('fullName'));
            return 'Nama lengkap wajib diisi.';
        }
        if (!waRegex.test(data.whatsapp)) {
            markError(document.getElementById('whatsapp'));
            return 'Nomor WhatsApp tidak valid. Contoh: 081234567890';
        }
        if (!emailRegex.test(data.email)) {
            markError(document.getElementById('email'));
            return 'Format email tidak valid.';
        }
        if (data.password.length < 8) {
            markError(document.getElementById('password'));
            return 'Password minimal 8 karakter.';
        }
        if (data.password !== data.confirmPassword) {
            markError(document.getElementById('confirmPassword'));
            return 'Password dan Konfirmasi Password tidak cocok.';
        }
        if (!data.selectedPackage) {
            return 'Silakan pilih paket keanggotaan terlebih dahulu.';
        }
        if (!paymentFile) {
            return 'Bukti pembayaran wajib diupload.';
        }
        if (paymentFile.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
            return `Ukuran file terlalu besar. Maksimal ${MAX_FILE_SIZE_MB}MB.`;
        }
        return null; // tidak ada error
    }

    // ── Kirim ke Telegram ─────────────────────────────────────
    async function sendToTelegram(data, paymentFile) {
        const localTime = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Makassar' });
        const pkg = membershipPackages.find(p => p.value === data.selectedPackage);
        const price = pkg ? pkg.price : 0;

        const captionText =
            `📝 *Pendaftar Baru UMTacademy*\n\n` +
            `👤 *Nama Lengkap:* ${data.fullName}\n` +
            `📱 *WhatsApp:* ${data.whatsapp}\n` +
            `📧 *Email:* ${data.email}\n` +
            `🔑 *Password:* ${data.password}\n` +
            `📦 *Paket:* ${data.selectedPackage}\n` +
            `💰 *Total Bayar:* Rp ${price.toLocaleString('id-ID')}\n\n` +
            `🕒 *Waktu Daftar:* ${localTime}`;

        const formData = new FormData();
        formData.append('chat_id',    CHAT_ID);
        formData.append('document',   paymentFile);   // ✅ File langsung, bukan FileList
        formData.append('caption',    captionText);
        formData.append('parse_mode', 'Markdown');

        const response = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`,
            { method: 'POST', body: formData }
        );

        // ✅ Baca pesan error asli dari Telegram
        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.description || `HTTP ${response.status}`);
        }

        return response.json();
    }

    // ── Reset form setelah berhasil ───────────────────────────
    function resetForm() {
        registrationForm.reset();
        fileNameDisplay.style.display = 'none';
        fileNameDisplay.textContent = '';
        fileUploadLabel.classList.remove('has-file');
        fileUploadText.textContent = 'Pilih File (Gambar/PDF, maks. 10MB)';
        updatePaymentInfo();
    }

    // ── Handler submit utama ──────────────────────────────────
    async function handleRegistrationSubmit(event) {
        event.preventDefault();
        hideError();
        successMessageContainer.style.display = 'none';

        // Ambil file langsung saat submit (bukan dari object data)
        const paymentFile = fileInput.files[0] || null;

        const data = {
            fullName:        document.getElementById('fullName').value.trim(),
            whatsapp:        document.getElementById('whatsapp').value.trim(),
            email:           document.getElementById('email').value.trim(),
            password:        document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value,
            selectedPackage: packageSelect.value,
        };

        // Validasi dulu, baru kirim
        const validationError = validateForm(data, paymentFile);
        if (validationError) {
            showError(validationError);
            return;
        }

        const originalButtonHTML = submitButton.innerHTML;
        submitButton.disabled = true;
        submitButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Mengirim...`;

        try {
            await sendToTelegram(data, paymentFile);

            successMessageContainer.innerHTML =
                `<i class="fas fa-check-circle"></i> 🎉 <strong>Pendaftaran Berhasil!</strong><br><br>
                Terima kasih <strong>${data.fullName}</strong>, data Anda telah kami terima.<br><br>
                Tim kami akan melakukan verifikasi dalam <strong>1×24 jam</strong>.<br><br>
                Notifikasi akan dikirim ke <strong>WhatsApp</strong> atau <strong>email</strong> Anda.`;
            successMessageContainer.style.display = 'block';
            successMessageContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            resetForm();

        } catch (error) {
            console.error('Telegram error:', error);
            // ✅ Tampilkan pesan spesifik dari Telegram API
            showError(`Gagal mengirim data: ${error.message}. Periksa koneksi Anda dan coba lagi.`);
        } finally {
            submitButton.disabled = false;
            submitButton.innerHTML = originalButtonHTML;
        }
    }

    // ── Event listeners ───────────────────────────────────────
    registrationForm.addEventListener('submit', handleRegistrationSubmit);

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (file) {
            // Cek ukuran langsung saat pilih file
            if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
                showError(`File terlalu besar. Maksimal ${MAX_FILE_SIZE_MB}MB.`);
                fileInput.value = '';
                return;
            }
            fileUploadLabel.classList.add('has-file');
            fileUploadText.textContent = '✓ File terpilih';
            fileNameDisplay.style.display = 'block';
            fileNameDisplay.textContent = file.name;
            hideError();
        } else {
            fileUploadLabel.classList.remove('has-file');
            fileUploadText.textContent = 'Pilih File (Gambar/PDF, maks. 10MB)';
            fileNameDisplay.style.display = 'none';
            fileNameDisplay.textContent = '';
        }
    });

    packageSelect.addEventListener('change', updatePaymentInfo);

    document.querySelectorAll('.copy-btn').forEach(button => {
        button.addEventListener('click', () => {
            const text = button.dataset.copy;
            navigator.clipboard.writeText(text).then(() => {
                const orig = button.textContent;
                button.textContent = 'Tersalin!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = orig;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                alert('Gagal menyalin. Silakan salin secara manual: ' + text);
            });
        });
    });

    // ── Inisialisasi ──────────────────────────────────────────
    populatePackageOptions();

    // Pre-select paket dari URL jika ada (?paket=1+Bulan)
    const urlParams = new URLSearchParams(window.location.search);
    const paketDariURL = urlParams.get('paket');
    if (paketDariURL) {
        const valid = membershipPackages.some(p => p.value === paketDariURL);
        if (valid) {
            packageSelect.value = paketDariURL;
            packageSelect.disabled = true;
            packageSelect.dispatchEvent(new Event('change'));
        }
    }
});
</script>

</body>
</html>

function renderSprintDetailPage(sprintId) {
    const sprintData = allContentData.sprintMateri.find(item => item.id === sprintId);
    if (!sprintData) { appContent.innerHTML = `<p>Konten sprint tidak ditemukan.</p>`; return; }

    const completedItems = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.COMPLETED_ITEMS)) || [];

    let accordionHTML = '';
    if (Object.keys(sprintData.content).length === 0) {
        accordionHTML = `
            <div class="flex flex-col items-center justify-center py-12 gap-3"
                 style="color:var(--text-subtle)">
                <i class="fa-solid fa-clock text-3xl"></i>
                <p class="text-sm">Latihan untuk sprint ini belum tersedia.</p>
            </div>
        `;
    } else {
        for (const subCategory in sprintData.content) {
            const subItems  = sprintData.content[subCategory];
            const doneCount = subItems.filter(i => completedItems.includes(i.id)).length;
            const pct       = subItems.length > 0 ? Math.round((doneCount / subItems.length) * 100) : 0;

            const itemsHTML = subItems.map(item => {
                const done = completedItems.includes(item.id);
                return `
                    <li class="flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer transition-colors group"
                        onmouseover="this.style.background='var(--bg-main)'"
                        onmouseout="this.style.background='transparent'"
                        onclick="openSprintLatihan('${item.id}', '${item.filePath}')">
                        <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0"
                             style="${done
                                ? 'background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3)'
                                : 'background:var(--bg-main);border:1px solid var(--border-color)'}">
                            <i class="fa-solid ${done ? 'fa-check text-[10px]' : 'fa-bolt text-[10px]'}"
                               style="color:${done ? 'var(--accent-green)' : 'var(--text-subtle)'}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-semibold truncate" style="color:var(--text-primary)">${item.title}</div>
                            <div class="text-[11px] mt-0.5" style="color:var(--text-secondary)">${item.type}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"
                           style="color:var(--text-subtle)"></i>
                    </li>
                `;
            }).join('');

            accordionHTML += `
                <div class="accordion-item border-b last:border-b-0" style="border-color:var(--border-color)" data-accordion-group>
                    <button type="button" class="accordion-button w-full flex items-center gap-3 p-4 text-left transition-colors hover:bg-[var(--bg-panel2)]">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                             style="background:var(--accent-cyan-dim);border:1px solid rgba(34,211,238,0.2)">
                            <i class="fa-solid fa-layer-group text-xs" style="color:var(--accent-cyan)"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-sm" style="color:var(--text-primary)">${subCategory}</div>
                            <div class="flex items-center gap-2 mt-1">
                                <div style="flex:1;height:3px;background:var(--border-color);border-radius:2px;overflow:hidden">
                                    <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent-cyan2),var(--accent-cyan));border-radius:2px;transition:width .5s ease"></div>
                                </div>
                                <span class="text-[10px] font-mono flex-shrink-0" style="color:var(--text-secondary)">${doneCount}/${subItems.length}</span>
                            </div>
                        </div>
                        <i class="accordion-icon fa-solid fa-chevron-down text-xs flex-shrink-0 transition-transform duration-200 rotate-180"
                           style="color:var(--text-subtle)"></i>
                    </button>
                    <div class="accordion-content px-2 pb-2">
                        <ul class="space-y-0.5">${itemsHTML}</ul>
                    </div>
                </div>
            `;
        }
    }

    // Total progress sprint ini
    const allSub  = Object.values(sprintData.content).flat();
    const doneSub = allSub.filter(i => completedItems.includes(i.id)).length;
    const pctAll  = allSub.length > 0 ? Math.round((doneSub / allSub.length) * 100) : 0;

    appContent.innerHTML = `
        <div class="panel">
            <!-- Back + header -->
            <div class="flex items-start gap-3 mb-5">
                <button onclick="navigateTo('sprint_materi', document.querySelector('.sidebar-link[onclick*=\\'sprint_materi\\']'))"
                        class="w-9 h-9 flex items-center justify-center rounded-xl flex-shrink-0 transition-colors mt-0.5"
                        style="background:var(--bg-panel2);border:1px solid var(--border-color);color:var(--text-secondary)"
                        onmouseover="this.style.borderColor='var(--accent-cyan)';this.style.color='var(--accent-cyan)'"
                        onmouseout="this.style.borderColor='var(--border-color)';this.style.color='var(--text-secondary)'">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </button>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full"
                              style="background:var(--accent-cyan-dim);color:var(--accent-cyan)">
                            Latihan Sprint
                        </span>
                    </div>
                    <h2 class="text-xl font-bold leading-snug" style="color:var(--accent-cyan)">${sprintData.title}</h2>
                    <p class="text-xs mt-1" style="color:var(--text-secondary)">${sprintData.summary}</p>
                </div>
            </div>

            <!-- Progress bar -->
            ${allSub.length > 0 ? `
                <div class="flex items-center gap-3 px-4 py-3 rounded-xl mb-5"
                     style="background:var(--bg-panel2);border:1px solid var(--border-color)">
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-xs font-semibold" style="color:var(--text-secondary)">Progress Sprint</span>
                            <span class="text-xs font-mono font-bold" style="color:var(--accent-cyan)">${doneSub}/${allSub.length} selesai</span>
                        </div>
                        <div style="height:5px;background:var(--border-color);border-radius:3px;overflow:hidden">
                            <div style="height:100%;width:${pctAll}%;background:linear-gradient(90deg,var(--accent-cyan2),var(--accent-cyan));border-radius:3px;transition:width .6s ease"></div>
                        </div>
                    </div>
                    <div class="text-xl font-bold font-mono flex-shrink-0" style="color:var(--accent-cyan)">${pctAll}%</div>
                </div>
            ` : ''}

            <!-- Accordion -->
            <div class="rounded-xl overflow-hidden" style="border:1px solid var(--border-color)">
                ${accordionHTML}
            </div>
        </div>
    `;

    setupAccordionListeners();
}

function openSprintLatihan(itemId, filePath) {
    if (!filePath || filePath === '#') {
        showToast('Konten untuk latihan ini belum tersedia.', 'info');
        return;
    }

    let foundItem = null;
    for (const sprint of allContentData.sprintMateri) {
        for (const subKey in sprint.content) {
            const item = sprint.content[subKey].find(i => i.id === itemId);
            if (item) { foundItem = item; break; }
        }
        if (foundItem) break;
    }

    if (foundItem) {
        updateLastActivity('materi', foundItem);
        markAsCompleted(itemId);
        showToast('Progres telah dicatat!', 'success');
    } else {
        markAsCompleted(itemId);
    }

    window.location.href = filePath;
}
